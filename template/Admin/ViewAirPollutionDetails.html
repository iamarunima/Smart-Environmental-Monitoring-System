{% include 'Admin/PageHeader.html' %}
<head>
  <style>
    #cs {
      font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
      border-collapse: collapse;
      width: 100%;
    }

    #cs td,
    #cs th {
      border: 1px solid #ddd;
      padding: 8px;
    }

    #cs tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    #cs tr:hover {
      background-color: #ddd;
    }

    #cs th {
      padding-top: 12px;
      padding-bottom: 12px;
      text-align: left;
    }
  </style>
</head>
<div class="py-5 container">
  <h2>View Air Pollution Report</h2>
  <table id="cs">
    <tr>
      <td>
        <div align="center"><h3>Address</h3></div>
      </td>

      <td>
        <div align="center"><h3>Message</h3></div>
      </td>
      <td>
        <div align="center"><h3>Pollution Date</h3></div>
      </td>
    </tr>
    {% for row in data %}
    <tr>
      <td><div align="center">{{ row.0 }}</div></td>

      <td><div align="center">{{ row.5 }}</div></td>
      <td><div align="center">{{ row.4 }}</div></td>
      <td width="80">
        <div align="center">
          <a href="/viewLocation/{{ row.1 }}/{{ row.2}}">Location</a>
        </div>
      </td>
      {% endfor %}
    </tr>
  </table>
</div>

{% include 'LoginFooter.html' %}
