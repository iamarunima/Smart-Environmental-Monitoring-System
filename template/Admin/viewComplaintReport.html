{% include 'Admin/PageHeader.html' %}
<head>
  <style>
    #cs {
      font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
      border-collapse: collapse;
      width: 100%;
    }

    #cs td,
    #cs th {
      border: 1px solid #ddd;
      padding: 8px;
    }

    #cs tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    #cs tr:hover {
      background-color: #ddd;
    }

    #cs th {
      padding-top: 12px;
      padding-bottom: 12px;
      text-align: left;
    }
  </style>
</head>
<div class="py-5 container">
  <h2>Complaint Report</h2>
  <table id="cs">
    <tr>
      <td><h3>User id</h3></td>
      <td><h3>Complaint Date</h3></td>
      <td><h3>Description</h3></td>
      <td><h3>reply</h3></td>
      <td><h3>Simulator id</h3></td>
    </tr>
    {% for row in data %}

    <tr>
      <td><div align="center">{{ row.1 }}</div></td>
      <td><div align="center">{{ row.2 }}</div></td>
      <td><div align="center">{{ row.3}}</div></td>
      <td><div align="center">{{ row.4 }}</div></td>
      <td><div align="center">{{ row.5 }}</div></td>
    </tr>
    {% endfor %}
  </table>
</div>
