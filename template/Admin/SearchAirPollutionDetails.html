{% include 'Admin/PageHeader.html' %}
<p>&nbsp;</p>
<head>
  <style>
    #cs {
      font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
      border-collapse: collapse;
      width: 100%;
    }

    #cs td,
    #cs th {
      border: 1px solid #ddd;
      padding: 8px;
    }

    #cs tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    #cs tr:hover {
      background-color: #ddd;
    }

    #cs th {
      padding-top: 12px;
      padding-bottom: 12px;
      text-align: left;
    }
  </style>
</head>
<div class="py-5 container">
  <h2>View Air Pollution Report</h2>
  <table id="cs">
    <tr>
      <td>
        <div align="center"><h3>Sl.No</h3></div>
      </td>
      <td>
        <div align="center"><h3>Message</h3></div>
      </td>
      <td>
        <div align="center"><h3>Pollution Date</h3></div>
      </td>
    </tr>
    {% for row in data %}

    <tr>
      <td><div align="center">{{ forloop.counter }}</div></td>
      <td><div align="center">{{ row.2 }}</div></td>
      <td><div align="center">{{ row.1 }}</div></td>

      {% endfor %}
    </tr>
  </table>
</div>
