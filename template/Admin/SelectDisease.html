{% include 'Admin/PageHeader.html' %}
<head>
    <style>
        #cs {
            font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }

            #cs td, #cs th {
                border: 1px solid #ddd;
                padding: 8px;
            }

            #cs tr:nth-child(even) {
                background-color: #f2f2f2;
            }

            #cs tr:hover {
                background-color: #ddd;
            }

            #cs th {
                padding-top: 12px;
                padding-bottom: 12px;
                text-align: left;
            }
    </style>
</head>
<div align="center">
   
<h2>Edit Disease</h2>
<form autocomplete="off"  id="form1" name="form1" method="post" action="/editDiseases" >{% csrf_token %}
    <table id="cs">
<tr>
      <input autocomplete="off" type="hidden" name="id" id="dd"value="{{ data.0 }}" required/>
    </tr>

        <tr><th>Name</th><td><input autocomplete="off" name="TxtName" type="text" value="{{ data.1 }}" pattern="^[a-zA-Z0-9._%+-]+( [a-zA-Z0-9._%+-]+)*$" required></td></tr>
        <tr><th>Disease description</th><td><textarea name="TxtDesc" type="text" value="{{ data.2}}" required>{{ data.2 }}</textarea></td></tr>

        <tr><th>Pollution Type</th><td>{{ data.3}}</td></tr>
        <tr>
            <th> </th><td><input autocomplete="off" type="submit" value="Update" class="btn btn-default" /></td>
        </tr>

    </table>
</form>
    </div>
<p>&nbsp;</p>
<p>&nbsp;</p>
<p>&nbsp;</p>
