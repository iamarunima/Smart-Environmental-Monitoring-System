{% include 'Admin/PageHeader.html' %}

<head>
    <style>
        #cs {
            font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }

        #cs td,
        #cs th {
            border: 1px solid #ddd;
            padding: 8px;
        }

        #cs tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        #cs tr:hover {
            background-color: #ddd;
        }

        #cs th {
            padding-top: 12px;
            padding-bottom: 12px;
            text-align: left;
        }
    </style>
</head>

<body>
    <div class="container py-5">
        <h2>View Device</h2>
        <table id="cs">
            <tr>
                <td>
                    <h3>Staff id</h3>
                </td>
                <td>
                    <h3>Device id</h3>
                </td>
                <td>
                    <h3>Address</h3>
                </td>
                <td>
                    <h3>Pincode</h3>
                </td>
                <td>
                    <h3>Assigned date</h3>
                </td>

            </tr>
            {% for row in data %}

            <tr>
                <td height="87">
                    <div align="center">{{ row.1 }}</div>
                </td>
                <td>
                    <div align="center">{{ row.2 }}</div>
                </td>
                <td>
                    <div align="center">{{ row.5 }}</div>
                </td>
                <td>
                    <div align="center">{{ row.6 }}</div>
                </td>
                <td>
                    <div align="center">{{ row.9 }}</div>
                </td>
            </tr>
            {% endfor %}
            <tr>
                <td width="80">
                    <div align="center"><a href="../staffAssign">Assign Staff</a></div>
                </td>
            </tr>
            </tr>


        </table>
    </div>
</body>
