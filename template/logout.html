{% include 'LoginHeader.html' %}
<html>
  <head>
    <script>
      function disableBackButton() {
        window.history.forward();
      }
      function goBack() {
        window.history.back();
      }
    </script>
    <style>
      .logout_page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .card {
        width: 400px;
        max-width: 100%;
        margin: auto;
      }
    </style>
  </head>
  <body onunload="disableBackButton()" onload="disableBackButton()">
    <main class="logout_page">
      <div class="container py-5">
        <div class="row justify-content-center">
          <div class="col-12">
            <div class="card shadow">
              <!-- <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Logout Confirmation</h4>
              </div> -->
              <div class="card-body text-center py-4">
                <div class="mb-4">
                  <i
                    class="bi bi-question-circle text-warning"
                    style="font-size: 3rem"
                  ></i>
                </div>
                <h5 class="card-title mb-3">
                  Are you sure you want to logout?
                </h5>
                <p class="card-text text-muted mb-4">
                  You'll need to login again to access your account.
                </p>
                <div class="d-flex justify-content-center gap-3">
                  <button
                    onclick="goBack()"
                    class="btn btn-outline-secondary px-4"
                  >
                    Cancel
                  </button>
                  <a href="login" class="btn btn-primary px-4">Logout</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
