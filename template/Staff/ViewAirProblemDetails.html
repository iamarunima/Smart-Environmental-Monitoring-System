{% include 'Staff/PageHeader.html' %}
<head>
  <style>
    #cs {
      font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
      border-collapse: collapse;
      width: 100%;
    }

    #cs td,
    #cs th {
      border: 1px solid #ddd;
      padding: 8px;
    }

    #cs tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    #cs tr:hover {
      background-color: #ddd;
    }

    #cs th {
      padding-top: 12px;
      padding-bottom: 12px;
      text-align: left;
    }
  </style>
</head>
<div class="py-5">
  <div class="container">
    <h2>View Air Problem Report</h2>
    <table id="cs">
      <tr>
        <td>
          <h3><div align="center">Device Address</div></h3>
        </td>

        <td>
          <h3><div align="center">Device Message</div></h3>
        </td>
        <td>
          <h3><div align="center">Pollution Date</div></h3>
        </td>
      </tr>
      {% for row in data %}

      <tr>
        <td><div align="center">{{ row.0 }}</div></td>

        <td><div align="center">{{ row.5 }}</div></td>
        <td><div align="center">{{ row.4 }}</div></td>
        {% endfor %}
      </tr>
    </table>
  </div>
</div>
