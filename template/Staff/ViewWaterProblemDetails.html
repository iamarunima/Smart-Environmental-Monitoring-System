{% include 'Staff/PageHeader.html' %}
<head>
  <style>
    #cs {
      font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
      border-collapse: collapse;
      width: 100%;
    }

    #cs td,
    #cs th {
      border: 1px solid #ddd;
      padding: 8px;
    }

    #cs tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    #cs tr:hover {
      background-color: #ddd;
    }

    #cs th {
      padding-top: 12px;
      padding-bottom: 12px;
      text-align: left;
    }
  </style>
</head>
<div class="py-5">
  <div class="container">
    <h2>View Water Problem Report</h2>
    <table id="cs">
      <tr>
        <td><h3>Lead</h3></td>
        <td><h3>Arsenic</h3></td>
        <td><h3>Mercury</h3></td>
        <td><h3>Oil</h3></td>
        <td><h3>Detected date</h3></td>
        <td><h3>Simulator id</h3></td>
      </tr>
      {% for row in data %}

      <tr>
        <td><div align="center">{{row.2}}</div></td>
        <td><div align="center">{{ row.3 }}</div></td>
        <td><div align="center">{{ row.4 }}</div></td>
        <td><div align="center">{{ row.5 }}</div></td>
        <td><div align="center">{{ row.6 }}</div></td>
        <td><div align="center">{{ row.1 }}</div></td>

        {% endfor %}
      </tr>
    </table>
  </div>
</div>
{% include 'LoginFooter.html' %}
