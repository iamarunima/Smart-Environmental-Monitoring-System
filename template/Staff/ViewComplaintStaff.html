{% include 'Staff/PageHeader.html' %}
<head>
  <style>
    #cs {
      font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
      border-collapse: collapse;
      width: 100%;
    }

    #cs td,
    #cs th {
      border: 1px solid #ddd;
      padding: 8px;
    }

    #cs tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    #cs tr:hover {
      background-color: #ddd;
    }

    #cs th {
      padding-top: 12px;
      padding-bottom: 12px;
      text-align: left;
    }
  </style>
</head>
<div class="py-5">
  <div class="container">
    <h2>View Complaint Report</h2>
    <table id="cs">
      <tr>
        <td>
          <div align="center"><h3>User</h3></div>
        </td>
        <td>
          <div align="center"><h3>Complaint Date</h3></div>
        </td>
        <td>
          <div align="center"><h3>Description</h3></div>
        </td>
        <td>
          <div align="center"><h3>Reply</h3></div>
        </td>
      </tr>
      {% for row in data %}

      <tr>
        <td><div align="center">{{ row.1 }}</div></td>
        <td><div align="center">{{ row.2 }}</div></td>
        <td><div align="center">{{ row.3 }}</div></td>
        <td><div align="center">{{ row.4 }}</div></td>

        <td width="80">
          <div align="center">
            <a href="/linkReplyComplaintSt/{{ row.0 }}">Reply</a>
          </div>
        </td>
      </tr>
      {% endfor %}
    </table>
  </div>
</div>

{% include 'LoginFooter.html' %}
